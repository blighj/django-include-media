name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Run black check
      run: |
        black --check .

    - name: Run isort check
      run: |
        isort --check-only .

    - name: Run flake8
      run: |
        flake8 .

  test:
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        django-version: ["5.2", "6.0"]
        exclude:
          # Django 6.0 requires Python 3.12+
          - python-version: "3.10"
            django-version: "6.0"
          - python-version: "3.11"
            django-version: "6.0"
        include:
          - python-version: "3.13"
            django-version: "git+https://github.com/django/django.git@main#egg=Django"
          - python-version: "3.13"
            django-version: "5.2"
            os: "windows-latest"

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        if [[ "${{ matrix.django-version }}" == git* ]]; then
          pip install ${{ matrix.django-version }}
        else
          pip install Django==${{ matrix.django-version }}.*
        fi
        pip install -e .

    - name: Run tests
      shell: bash
      run: |
        python tests/runtests.py

  coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "git+https://github.com/django/django.git@main#egg=Django" coverage
        pip install -e .

    - name: Run coverage
      run: |
        coverage run tests/runtests.py
        coverage report --format=markdown >> $GITHUB_STEP_SUMMARY
        coverage report
