[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-include-media"
version = "0.1.0"
description = "Include Django Media assets into <head> using template tags"
readme = "README.md"
license = "BSD-3-Clause"
authors = [
    {name = "Django Include Media Contributors"}
]
keywords = ["django", "media", "assets", "templatetags", "css", "javascript"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
dependencies = [
    "Django>=5.2",
]

[project.optional-dependencies]
dev = [
    "black>=22.0",
    "coverage>=7.0",
    "Django>=5.2",
    "flake8>=4.0",
    "isort>=5.0",
    "pre-commit>=3.0",
]

[project.urls]
Homepage = "https://github.com/blighj/django-include-media"
Repository = "https://github.com/blighj/django-include-media"
Issues = "https://github.com/blighj/django-include-media/issues"

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 88
